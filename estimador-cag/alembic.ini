[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
output_encoding = utf-8

# La URL real viene de app.config.get_settings().database_url (DATABASE_URL, driver asyncpg).
# Este valor es solo un marcador: env.py lee de Settings, no de aquí.
sqlalchemy.url = postgresql+asyncpg://estimator:estimator-dev@localhost:5432/estimator

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
