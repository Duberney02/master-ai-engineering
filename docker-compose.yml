# Stack completo en tres capas: frontends (React y Streamlit) → backend Go → servicio de IA, más Redis Stack y PostgreSQL.
#
#   cp estimador-cag/.env.example estimador-cag/.env   # y completa la API key del proveedor elegido
#   cp .env.example .env                               # opcional: contraseñas propias
#   docker compose up --build
#
# Backend Go (API JSON): http://localhost:3000 · Web React: http://localhost:3001 · Chat Streamlit: http://localhost:8501 · API de IA (docs): http://localhost:8000/docs
# Solo estimator-web (Go) llama a estimador-cag: React y Streamlit hablan únicamente con el backend. Redis es interno a la red;
# PostgreSQL (5432) publica puerto para psql en desarrollo.
# Para desarrollar solo el servicio de IA con recarga en caliente usa estimador-cag/docker-compose.yml.

name: estimator

services:
  estimador-cag:
    build:
      context: ./estimador-cag
      target: runtime
    image: estimador-cag:latest
    ports:
      - "8000:8000"
    # Claves del proveedor y ajustes del estimador (ignorado por git y por la imagen).
    env_file:
      - path: ./estimador-cag/.env
        required: true
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://estimator:${POSTGRES_PASSWORD:-estimator-dev}@postgres:5432/estimator
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [estimator-net]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  estimador-cag-chat:
    # Chat Streamlit (capa 1): proyecto propio (estimator-streamlit/) que solo habla HTTP con el backend Go.
    # No recibe claves de proveedores ni conoce el servicio de IA.
    build:
      context: ./estimator-streamlit
      target: runtime
    image: estimator-streamlit:latest
    ports:
      - "8501:8501"
    environment:
      ESTIMATOR_WEB_URL: http://estimator-web:3000
    depends_on:
      estimator-web:
        condition: service_healthy
    networks: [estimator-net]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  estimator-web:
    build:
      context: ./estimator-web-go
      target: runtime
    image: estimator-web:latest
    ports:
      - "3000:3000"
    # Backend de negocio (capa 2): API JSON y único cliente del servicio de IA; no recibe claves de proveedores.
    environment:
      ESTIMATOR_API_URL: http://estimador-cag:8000
      ESTIMATOR_READ_TIMEOUT: "300"
      ESTIMATOR_COMPARE_TIMEOUT: "600"
      # Historial del Chunking Lab: su propia base, distinta de la de la API.
      DATABASE_URL: postgres://estimator:${WEB_DB_PASSWORD:-estimator-web-dev}@estimator-web-db:5432/estimator_web
    depends_on:
      estimador-cag:
        condition: service_healthy
      estimator-web-db:
        condition: service_healthy
    networks: [estimator-net]
    init: true
    restart: unless-stopped
    healthcheck:
      # Imagen sin shell ni curl: el propio binario hace GET /up.
      test: ["CMD", "/estimator-web", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  estimator-web-db:
    # Base de datos del servicio web Go: solo el historial de comparaciones del Chunking Lab.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: ${WEB_DB_PASSWORD:-estimator-web-dev}
      POSTGRES_DB: estimator_web
    volumes:
      - estimator_web_db_data:/var/lib/postgresql/data
    networks: [estimator-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator -d estimator_web"]
      interval: 10s
      timeout: 3s
      retries: 5

  estimator-web-react:
    # Cliente web (capa 1): SPA estática con nginx, que reenvía /api/ al backend Go estimator-web (el navegador solo
    # habla con su origen: sin CORS). No recibe claves de proveedores ni conoce el servicio de IA.
    build:
      context: ./estimator-web-react
    image: estimator-web-react:latest
    ports:
      - "3001:8080"
    environment:
      API_UPSTREAM: http://estimator-web:3000
    depends_on:
      estimator-web:
        condition: service_healthy
    networks: [estimator-net]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--timeout=3", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    # Redis Stack: Redis + RediSearch, necesario para la caché semántica (búsqueda vectorial).
    image: redis/redis-stack-server:latest
    volumes:
      - redis_data:/data
    networks: [estimator-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    # PostgreSQL + pgvector: historial, ingesta (Sesión 6) y presupuestos vectorizados (Sesión 8).
    # pg17 como antes: el volumen postgres_data existente no es legible por otra versión mayor.
    image: pgvector/pgvector:pg17
    # Los builds HNSW paralelos usan memoria compartida (/dev/shm); el 64 MB por defecto de Docker se queda corto.
    shm_size: 1gb
    # Tuning para construir índices vectoriales. Son valores CONSERVADORES de desarrollo (máquina de ~2-4 GB);
    # en producción escalan con la RAM: shared_buffers ≈ 25 %, effective_cache_size ≈ 75 %, y maintenance_work_mem
    # lo bastante grande para que el grafo HNSW quepa en memoria durante el build.
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c max_parallel_maintenance_workers=2
    environment:
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estimator-dev}
      POSTGRES_DB: estimator
    # Solo desarrollo: permite psql desde el host.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [estimator-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator -d estimator"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  estimator-net:

volumes:
  redis_data:
  postgres_data:
  estimator_web_db_data:
