# Servicios de DESARROLLO/VERIFICACIÓN: todo se ejecuta en contenedores, nada en el host.
# Reutilizan la etapa `test` de estimador-cag/Dockerfile (uv + dependencias de desarrollo) y montan el
# código, de modo que no hace falta reconstruir la imagen al cambiarlo.
#
#   docker compose -f docker-compose.verify.yml run --rm api-test            # pytest -q (añade argumentos: api-test -k sessions)
#   docker compose -f docker-compose.verify.yml run --rm api-lint            # ruff check
#   docker compose -f docker-compose.verify.yml run --rm api-eval --help     # runner de evaluación
#   docker compose -f docker-compose.verify.yml run --rm api-stress --help   # stress test del CAG (necesita la API en marcha)
#   docker compose -f docker-compose.verify.yml run --rm openspec validate --all --strict
#   docker compose -f docker-compose.verify.yml run --rm api-uv lock         # regenerar uv.lock
#   docker compose -f docker-compose.verify.yml run --rm --entrypoint python api-test scripts/demo_cleaning_s06.py   # demos de la sesión 6
# El preflight y las pruebas contra PostgreSQL real se ejecutan con el stack raíz levantado (ver estimador-cag/README.md).

name: estimator-verify

x-api-dev: &api-dev
  build:
    context: ./estimador-cag
    target: test
  image: estimador-cag:test
  volumes:
    - ./estimador-cag:/app
  working_dir: /app
  environment:
    # Claves ficticias: ninguna prueba llama a un proveedor real.
    LLM_PROVIDER: openai
    OPENAI_API_KEY: sk-test-dummy

services:
  api-test:
    <<: *api-dev
    entrypoint: ["pytest"]
    command: ["-q"]

  api-lint:
    <<: *api-dev
    entrypoint: ["ruff"]
    command: ["check", "."]

  api-eval:
    <<: *api-dev
    entrypoint: ["python", "-m", "evals.runner"]

  # Stress test del CAG contra la API del Compose raíz (docker compose up -d estimador-cag): usa --http http://host.docker.internal:8000
  api-stress:
    <<: *api-dev
    entrypoint: ["python", "-m", "evals.stress.run"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api-uv:
    <<: *api-dev
    entrypoint: ["uv"]
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv

  # Cliente Rails: base de datos efímera y pruebas/lint en contenedor (el código se monta, sin reconstruir).
  #   docker compose -f docker-compose.verify.yml run --rm web-test                # bin/rails test
  #   docker compose -f docker-compose.verify.yml run --rm web-test test test/models/rag   # un subconjunto
  #   docker compose -f docker-compose.verify.yml run --rm web-lint                # rubocop
  web-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: estimator-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator"]
      interval: 2s
      timeout: 3s
      retries: 20

  web-test:
    build:
      context: ./estimator-web
      target: test
    image: estimator-web:test
    volumes:
      - ./estimator-web:/rails
    working_dir: /rails
    environment:
      RAILS_ENV: test
      DB_HOST: web-db
    depends_on:
      web-db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "bin/rails db:prepare && exec bin/rails \"$@\"", "--"]
    command: ["test"]

  web-lint:
    build:
      context: ./estimator-web
      target: test
    image: estimator-web:test
    volumes:
      - ./estimator-web:/rails
    working_dir: /rails
    entrypoint: ["bundle", "exec", "rubocop"]

  openspec:
    build:
      context: ./openspec
    image: estimador-openspec:1.13.2
    volumes:
      - .:/repo
    working_dir: /repo
