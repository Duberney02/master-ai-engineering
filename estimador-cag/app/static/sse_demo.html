<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Estimador CAG — Streaming</title>
<style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:0 20px;background:#f6f8fc;color:#18243a}textarea,button{font:inherit;padding:12px}textarea{box-sizing:border-box;width:100%;height:180px}button{margin:12px 0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px}#error{color:#a22020}</style>
<h1>Estimador CAG</h1><p>Pega la transcripción y recibe la estimación progresivamente.</p>
<form id="form"><textarea id="transcription" minlength="20" maxlength="50000" required aria-label="Transcripción"></textarea><button>Generar estimación</button></form>
<p id="status" role="status"></p><p id="error" role="alert"></p><pre id="result"></pre><pre id="metrics"></pre>
<script>
const form=document.querySelector('#form'), result=document.querySelector('#result');
form.onsubmit=async e=>{
 e.preventDefault();form.querySelector('button').disabled=true;
 result.textContent='';document.querySelector('#error').textContent='';document.querySelector('#metrics').textContent='';
 document.querySelector('#status').textContent='Generando…';let done=false;
 try{
  const response=await fetch('/api/v1/transcription/estimate/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({transcription:document.querySelector('#transcription').value})});
  if(!response.ok)throw Error(`Solicitud rechazada (HTTP ${response.status})`);
  const reader=response.body.getReader(), decoder=new TextDecoder();let buffer='';
  try{while(true){const part=await reader.read();if(part.done)break;buffer+=decoder.decode(part.value,{stream:true});
   const events=buffer.split(/\r?\n\r?\n/);buffer=events.pop();
   for(const event of events){let name='message', data=[];
    for(const line of event.split(/\r?\n/)){if(line.startsWith('event:'))name=line.slice(6).trim();if(line.startsWith('data:'))data.push(line.slice(5).replace(/^ /,''));}
    if(!data.length)continue;const value=JSON.parse(data.join('\n'));
    if(name==='token')result.textContent+=value.text;
    if(name==='metadata')document.querySelector('#metrics').textContent=JSON.stringify(value,null,2);
    if(name==='error')throw Error(value.message);
    if(name==='done')done=true;
   }
  }}finally{await reader.cancel();reader.releaseLock();}
  if(!done)throw Error('La conexión terminó sin completar la estimación.');
  document.querySelector('#status').textContent='Estimación completada';
 }catch(error){document.querySelector('#error').textContent=error.message;document.querySelector('#status').textContent='Estimación incompleta';}
 finally{form.querySelector('button').disabled=false;}
};
</script></html>
