# Docker Compose para DESARROLLO.
#
#   cp .env.example .env      # y completa la API key del proveedor elegido
#   docker compose up --build
#
# Levanta la API (sin puerto publicado) y Redis Stack (RediSearch). Inspección y pruebas desde el contenedor:
#   docker compose exec estimador-cag python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health').read())"
# Un puerto de diagnóstico local requiere el perfil explícito `diagnostico` (enlazado a 127.0.0.1).
# El código montado como volumen de solo lectura y --reload
# hacen que los cambios en el host se reflejen sin reconstruir la imagen.
# Para producción usa la imagen del Dockerfile tal cual (sin volumen ni --reload).

services:
  estimador-cag:
    build:
      context: .
      target: runtime
    image: estimador-cag:dev
    # Las claves y ajustes viven en .env (ignorado por git y por la imagen).
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # Claves de ejemplo de los routers RAG de la Sesión 9 (/v1/retrieval/*, /v1/estimate/*); las de .env tienen prioridad.
      RETRIEVAL_API_KEY: ${RETRIEVAL_API_KEY:-dev-retrieval-key}
      ESTIMATE_API_KEY: ${ESTIMATE_API_KEY:-dev-estimate-key}
      # En Docker Desktop (Windows/macOS) los eventos del sistema de archivos no
      # siempre llegan al contenedor: el sondeo hace fiable el --reload.
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      # Datos de ejemplo y CLI (scripts/query_examples.py) disponibles sin reconstruir la imagen.
      - ./data:/app/data:ro
      - ./scripts:/app/scripts:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Perfil explícito de diagnóstico: expone la API solo en el loopback del host. No forma parte del arranque normal.
  estimador-cag-diagnostico:
    extends:
      service: estimador-cag
    profiles: ["diagnostico"]
    ports:
      - "127.0.0.1:8000:8000"

  redis:
    # Redis Stack: Redis + RediSearch, necesario para la caché semántica (búsqueda vectorial).
    # Sin política de evicción: el índice vectorial no debe expulsarse; las entradas caducan por TTL.
    image: redis/redis-stack-server:latest
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
