# Complemento de docker-compose.verify.yml. Invocar desde la raíz con
# --env-file /dev/null y -p homelab-block1-307a8b9.
x-api: &api
  image: homelab-block1-307a8b9-api:test
  pull_policy: never
  build: !override
    context: ./.block1/estimador-cag
    target: test
  volumes: !override
    - type: bind
      source: ./.block1/estimador-cag
      target: /app
      read_only: true
      bind:
        create_host_path: false
  environment:
    LLM_PROVIDER: openai
    OPENAI_API_KEY: sk-test-dummy
    RUFF_NO_CACHE: "true"
    PYTEST_ADDOPTS: "-p no:cacheprovider"

x-go: &go
  image: homelab-block1-307a8b9-go:test
  pull_policy: never
  build: !override
    context: ./.block1/estimator-web-go
    target: test
  volumes: !override
    - type: bind
      source: ./.block1/estimator-web-go
      target: /src
      read_only: true
      bind:
        create_host_path: false
  environment:
    GOTOOLCHAIN: local
    GOPROXY: "off"
    GOSUMDB: "off"

services:
  # Los servicios residuales de la ejecución anterior quedan fuera de este modelo.
  api-db: !reset null
  web-db: !reset null
  api-eval: !reset null
  api-stress: !reset null
  api-uv: !reset null
  web-go: !reset null
  openspec: !reset null

  block1-api-db:
    extends:
      file: docker-compose.verify.yml
      service: api-db
    image: homelab-block1-307a8b9-pgvector:pg17
    pull_policy: never
    tmpfs: [/var/lib/postgresql/data]
    networks: [block1-api]

  block1-web-db:
    extends:
      file: docker-compose.verify.yml
      service: web-db
    image: homelab-block1-307a8b9-postgres:pg17
    pull_policy: never
    tmpfs: [/var/lib/postgresql/data]
    networks: [block1-web]

  api-test:
    <<: *api
    volumes: !override
      - type: bind
        source: ./.block1/estimador-cag
        target: /app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.block1-evidencias/parte-c/cl100k_base.tiktoken
        target: /opt/tiktoken-cache/9b5ad71b2ce5302211f9c61530b329a4922fc6a4
        read_only: true
        bind:
          create_host_path: false
    depends_on: !override
      block1-api-db:
        condition: service_healthy
    environment:
      LLM_PROVIDER: openai
      OPENAI_API_KEY: sk-test-dummy
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      TIKTOKEN_CACHE_DIR: /opt/tiktoken-cache
      TEST_DATABASE_URL: postgresql+asyncpg://estimator:estimator-dev@block1-api-db:5432/estimator_test
    networks: [block1-api]

  api-lint:
    <<: *api
    network_mode: none

  web-test:
    <<: *go
    depends_on: !override
      block1-web-db:
        condition: service_healthy
    environment:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
      TEST_DATABASE_URL: postgres://estimator:estimator-dev@block1-web-db:5432/estimator_web_test?sslmode=disable
    networks: [block1-web]

  web-lint:
    <<: *go
    network_mode: none

  react-test:
    build:
      context: ./.block1/estimator-web-react
      target: build
    image: homelab-block1-307a8b9-react:test
    pull_policy: never
    command: ["npm", "test"]
    network_mode: none

networks:
  block1-api: &internal
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  block1-web: *internal

volumes:
  web_go_cache: !reset null
