[project]
name = "estimador-cag"
version = "0.2.0"
description = "CAG-based software project estimation API (FastAPI) and Streamlit chat client"
readme = "README.md"
requires-python = ">=3.11"
# Sin dependencias comunes: servidor y cliente se instalan por separado con sus extras
# para que la imagen del chat no contenga SDK de proveedores, Redis ni el backend.
dependencies = []

[project.optional-dependencies]
# Servidor FastAPI: SDK de proveedores, Redis y configuración.
api = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "redis>=5.0",
]
# Cliente Streamlit: solo habla HTTP con la API.
ui = [
    "streamlit>=1.64.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyyaml>=6.0",
]

[tool.uv]
# `uv sync` instala servidor + cliente + herramientas de desarrollo.
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
