# Recorridos de extremo a extremo (cliente → Nginx → Go → Python). Se carga tras el Compose raíz y compose.network.yml:
#   -f docker-compose.yml -f verification/compose.network.yml -f verification/compose.e2e.yml
# Mantiene la topología aprobada. Añade, bajo perfiles explícitos: el proveedor OpenAI simulado (en ai-egress-net, desde donde
# IA lo alcanza con OPENAI_BASE_URL), el upstream Python con barreras deterministas (solo pruebas) y el cliente.
# Go apunta a ${E2E_IA_URL}: por defecto a la IA real; la fase de cancelación lo recrea apuntando al upstream con barreras.
x-tool: &tool
  image: ${VERIFY_NODE_IMAGE:-estimator-web-react:test}
  pull_policy: never
  init: true
  working_dir: /tools

services:
  estimador-cag:
    environment:
      OPENAI_BASE_URL: http://openai-fake:8080/v1
  estimator-web:
    environment:
      ESTIMATOR_API_URL: ${E2E_IA_URL:-http://estimador-cag:8000}

  openai-fake:
    <<: *tool
    profiles: ["e2e"]
    command: ["node", "openai-fake.mjs"]
    volumes:
      - ./verification:/tools:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/__sim/state').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      ai-egress-net:
        aliases: [openai-fake]

  ia-fixture:
    image: ${VERIFY_API_IMAGE:-estimador-cag:test}
    pull_policy: never
    profiles: ["e2e-fixture"]
    working_dir: /app
    volumes:
      - type: bind
        source: ./estimador-cag
        target: /app
        read_only: true
      - type: bind
        source: ./.verification/cache/cl100k_base.tiktoken
        target: /opt/tiktoken-cache/9b5ad71b2ce5302211f9c61530b329a4922fc6a4
        read_only: true
    environment:
      LLM_PROVIDER: openai
      OPENAI_API_KEY: sk-test-dummy
      TIKTOKEN_CACHE_DIR: /opt/tiktoken-cache
      TEST_DATABASE_URL: postgresql+asyncpg://estimator:${POSTGRES_PASSWORD:-estimator-dev}@postgres:5432/estimator
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint: ["python", "-m", "uvicorn", "tests.integration_fixture:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    networks: [service-net, ai-data-net]

  e2e:
    <<: *tool
    profiles: ["e2e"]
    entrypoint: ["node", "e2e.mjs"]
    environment:
      CLIENT: http://estimator-web-react:8080
      SIM: http://openai-fake:8080
      FIXTURE: http://ia-fixture:8000
    volumes:
      - ./verification:/tools:ro
      - ./.verification/fixtures:/fixtures:ro
    # Posición de cliente (client-net) más acceso de control al proveedor simulado y al upstream con barreras.
    networks: [client-net, service-net, ai-egress-net]
