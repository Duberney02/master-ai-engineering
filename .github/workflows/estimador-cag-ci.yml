name: estimador-cag CI

# Valida la aplicación y las especificaciones que gobiernan sus cambios. Todas las suites se ejecutan en Docker con
# credenciales ficticias (DA-09, DA-14) y los servicios se comprueban con sondas internas, sin publicar FastAPI.
on:
  push:
    branches: [master]
    paths: ["estimador-cag/**", "estimator-web-go/**", "estimator-web-react/**", "docker-compose.yml", "docker-compose.verify.yml", ".env.example", "openspec/**", ".agents/**", ".github/workflows/estimador-cag-ci.yml"]
  pull_request:
    paths: ["estimador-cag/**", "estimator-web-go/**", "estimator-web-react/**", "docker-compose.yml", "docker-compose.verify.yml", ".env.example", "openspec/**", ".agents/**", ".github/workflows/estimador-cag-ci.yml"]

env:
  VERIFY: docker compose -f docker-compose.verify.yml

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: $VERIFY run --rm openspec validate --all --strict
        env:
          OPENSPEC_TELEMETRY: "0"
  test:
    # Lint y pruebas de la API de IA en la etapa `test` del Dockerfile. api-test levanta su propio PostgreSQL con
    # pgvector (api-db) para las pruebas de integración y no llama a proveedores reales (SDK simulados).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: $VERIFY build api-test
      - run: $VERIFY run --rm api-lint
      - run: $VERIFY run --rm api-test -v
      - name: Limpiar el proyecto de pruebas
        if: always()
        run: $VERIFY down -v --remove-orphans

  docker:
    # Verifica que la imagen se construye, arranca como usuario sin privilegios
    # y que su health check pasa a "healthy".
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: estimador-cag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build image
        run: docker build --tag estimador-cag:ci .

      - name: Image runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id estimador-cag:ci -u)"
          echo "uid=$uid"
          test "$uid" != "0"

      - name: Container becomes healthy
        run: |
          docker run -d --name estimador-ci -e LLM_PROVIDER=openai -e OPENAI_API_KEY=sk-ci-dummy \
            estimador-cag:ci
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' estimador-ci)"
            echo "health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs estimador-ci
          exit 1

  web:
    # Pruebas Go de estimator-web-go (la API de IA está simulada: nunca llaman a la real), gofmt y go vet, con
    # PostgreSQL efímero para el historial del Chunking Lab.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: $VERIFY run --rm web-lint
      - run: $VERIFY run --rm web-test
      - name: Limpiar el proyecto de pruebas
        if: always()
        run: $VERIFY down -v --remove-orphans

  web-react:
    # Vitest y compilación (tsc + vite) del cliente React en contenedor y sin red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: $VERIFY run --rm react-test
      - run: $VERIFY run --rm react-build
      - name: Limpiar el proyecto de pruebas
        if: always()
        run: $VERIFY down -v --remove-orphans

  stack:
    # Compose raíz: construye las imágenes, espera a que los servicios estén healthy
    # y comprueba con sondas internas y por el origen React que el historial está operativo.
    runs-on: ubuntu-latest
    needs: [test, web, web-react]
    steps:
      - uses: actions/checkout@v4

      - name: "Prepare env (dummy key, no provider is called)"
        run: |
          {
            echo LLM_PROVIDER=openai
            echo OPENAI_API_KEY=sk-ci-dummy
            echo MODERATION_ENABLED=false
          } > estimador-cag/.env

      - run: docker compose config --quiet

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Smoke checks
        # Sondas internas (exec dentro de cada contenedor) y el único origen público, React/Nginx. No dependen de
        # puertos publicados de FastAPI ni de Go.
        run: |
          docker compose exec -T estimador-cag python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
          docker compose exec -T estimator-web /estimator-web healthcheck
          curl -fsS http://localhost:3001/healthz
          test "$(curl -fsS http://localhost:3001/api/v1/estimations)" = "[]"
          curl -fsS http://localhost:3001/estimations | grep -q '<div id="root">'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v
