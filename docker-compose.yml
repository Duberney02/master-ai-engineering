# Stack de integración: API del estimador (IA), aplicaciones web (Go y React), Redis Stack y dos PostgreSQL.
#
#   cp estimador-cag/.env.example estimador-cag/.env   # y completa la API key del proveedor elegido
#   cp .env.example .env                               # opcional: contraseñas y secretos propios
#   docker compose up --build
#
# Único acceso: React/Nginx en http://127.0.0.1:3001, solo desde el propio host (túnel SSH para el operador). Entorno
# privado de desarrollo: sin exposición pública ni uso multiusuario hasta completar homelab-authentication-authorization.
# Go, la API de IA (8000), Redis y PostgreSQL no publican puertos; se comprueban con sondas internas
# (docker compose exec <servicio> ...).
#
# Redes (DA-03, DA-04, DA-22):
#   client-net     React/Nginx y Go. Única red de React; permite publicar 127.0.0.1:3001 y no hace NAT de salida.
#   service-net    Go y estimador-cag (interna).
#   go-data-net    Go y su PostgreSQL del Chunking Lab (interna).
#   ai-data-net    estimador-cag, Redis Stack y PostgreSQL de IA (interna).
#   ai-egress-net  Solo estimador-cag, para HTTPS hacia los proveedores; sin puertos publicados.
# Para desarrollar solo el backend con recarga en caliente usa estimador-cag/docker-compose.yml.

name: estimator

services:
  estimador-cag:
    build:
      context: ./estimador-cag
      target: runtime
    image: estimador-cag:latest
    # Claves del proveedor y ajustes del estimador (ignorado por git y por la imagen).
    env_file:
      - path: ./estimador-cag/.env
        required: true
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://estimator:${POSTGRES_PASSWORD:-estimator-dev}@postgres:5432/estimator
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Única con credenciales de proveedores (DA-06) y única con salida a Internet.
    networks: [service-net, ai-data-net, ai-egress-net]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  estimator-web:
    build:
      context: ./estimator-web-go
      target: runtime
    image: estimator-web:latest
    # Go es la única frontera hacia la IA (DA-04) y no recibe claves de proveedores.
    environment:
      ESTIMATOR_API_URL: http://estimador-cag:8000
      ESTIMATOR_READ_TIMEOUT: "300"
      ESTIMATOR_COMPARE_TIMEOUT: "600"
      # Origen canónico del navegador para validar las mutaciones. Con túnel SSH a otro puerto local, defínelo en .env.
      ESTIMATOR_PUBLIC_ORIGIN: ${ESTIMATOR_PUBLIC_ORIGIN:-http://localhost:3001}
      # Historial del Chunking Lab: su propia base, distinta de la de la API.
      DATABASE_URL: postgres://estimator:${WEB_DB_PASSWORD:-estimator-web-dev}@estimator-web-db:5432/estimator_web
    depends_on:
      estimador-cag:
        condition: service_healthy
      estimator-web-db:
        condition: service_healthy
    networks: [client-net, service-net, go-data-net]
    init: true
    restart: unless-stopped
    healthcheck:
      # Imagen sin shell ni curl: el propio binario hace GET /up.
      test: ["CMD", "/estimator-web", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  estimator-web-db:
    # Base de datos del servicio web Go: solo el historial de comparaciones del Chunking Lab.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: ${WEB_DB_PASSWORD:-estimator-web-dev}
      POSTGRES_DB: estimator_web
    volumes:
      - estimator_web_db_data:/var/lib/postgresql/data
    networks: [go-data-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator -d estimator_web"]
      interval: 10s
      timeout: 3s
      retries: 5

  estimator-web-react:
    # SPA estática con nginx, que reenvía /api/ al servicio Go (DA-03: React solo habla con Go, que es la única
    # frontera hacia la IA). El navegador solo habla con su origen: sin CORS. No recibe claves de proveedores.
    build:
      context: ./estimator-web-react
    image: estimator-web-react:latest
    # Único puerto publicado, solo en el loopback IPv4 del host (acceso del operador por túnel SSH).
    ports:
      - "127.0.0.1:3001:8080"
    environment:
      API_UPSTREAM: http://estimator-web:3000
    depends_on:
      estimator-web:
        condition: service_healthy
    networks: [client-net]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--timeout=3", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    # Redis Stack: Redis + RediSearch, necesario para la caché semántica (búsqueda vectorial).
    image: redis/redis-stack-server:latest
    volumes:
      - redis_data:/data
    networks: [ai-data-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    # PostgreSQL + pgvector: historial, ingesta (Sesión 6) y presupuestos vectorizados (Sesión 8).
    # pg17 como antes: el volumen postgres_data existente no es legible por otra versión mayor.
    image: pgvector/pgvector:pg17
    # Los builds HNSW paralelos usan memoria compartida (/dev/shm); el 64 MB por defecto de Docker se queda corto.
    shm_size: 1gb
    # Tuning para construir índices vectoriales. Son valores CONSERVADORES de desarrollo (máquina de ~2-4 GB);
    # en producción escalan con la RAM: shared_buffers ≈ 25 %, effective_cache_size ≈ 75 %, y maintenance_work_mem
    # lo bastante grande para que el grafo HNSW quepa en memoria durante el build.
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c max_parallel_maintenance_workers=2
    environment:
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estimator-dev}
      POSTGRES_DB: estimator
    # Sin puerto publicado: psql con `docker compose exec postgres psql -U estimator -d estimator`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [ai-data-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator -d estimator"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  client-net:
    # Sin NAT de salida: lo publicado en 127.0.0.1:3001 sigue entrando, pero React y Go no salen a Internet.
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  service-net:
    internal: true
  go-data-net:
    internal: true
  ai-data-net:
    internal: true
  ai-egress-net:

volumes:
  redis_data:
  postgres_data:
  estimator_web_db_data:
