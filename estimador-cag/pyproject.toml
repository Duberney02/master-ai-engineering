[project]
name = "estimador-cag"
version = "0.1.0"
description = "CAG-based software project estimation API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0.0",
    "tiktoken>=0.7.0",
    # Chunking por frases (Sesión 7): el tokenizador Punkt se descarga al construir la imagen.
    "nltk>=3.9",
    "anthropic>=0.40.0",
    "httpx>=0.27",
    "redis>=5.0,<7",
    "structlog>=25.1,<27",
    "jinja2>=3.1,<4",
    "redisvl>=0.8",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # Sesión 8: tipo `vector` y operadores de distancia (`cosine_distance`) para SQLAlchemy.
    "pgvector>=0.3",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    # Ingesta (sesión 6): catálogo, limpieza, PII y migraciones.
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pandera>=0.20",
    "alembic>=1.13",
    "presidio-analyzer>=2.2",
    "spacy>=3.8,<3.9",
    "faker>=24.0",
    # Sesión 9: rate limiting por clave de API en los endpoints RAG (`/v1/*`).
    "slowapi>=0.1.9",
    # Sesión 10: reranking con cross-encoder (recall-then-rerank). Arrastra `torch` (build CPU, ver [tool.uv.sources]).
    "sentence-transformers>=3.0",
    "torch>=2.2",
    # Modelo español de spaCy (rueda oficial; versión compatible con spaCy 3.8).
    "es-core-news-md @ https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "aiosqlite>=0.20",
    "fpdf2>=2.8",
    "httpx>=0.27",
    "fakeredis>=2.26",
    "ruff>=0.8",
    # Sesión 11: evaluación RAGAS de la generación. Solo los usan los scripts `*_ragas_s11.py` (jamás `pytest`).
    "ragas>=0.2,<0.4",
    "datasets>=2.19",
    # ragas 0.3 importa `langchain_community.chat_models.vertexai`, retirado en langchain-community 0.4.
    "langchain-community>=0.3,<0.4",
]

# `torch` desde el índice CPU de PyTorch: el wheel por defecto de Linux trae CUDA (varios GB) y no hay GPU en el servicio.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W: estilo pycodestyle, F: pyflakes (imports y variables sin usar), I: orden de imports.
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals", "tests"]

[tool.ruff.lint.per-file-ignores]
# Los datos de las pruebas (parámetros, textos de ejemplo) pueden superar la longitud de línea.
"tests/**" = ["E501"]
