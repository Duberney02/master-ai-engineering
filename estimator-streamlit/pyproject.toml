[project]
name = "estimator-streamlit"
version = "0.1.0"
description = "Chat Streamlit del estimador: cliente HTTP del backend estimator-web"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.64.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.8",
]

[tool.uv]
# Aplicación, no librería: solo se instalan las dependencias.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W: estilo pycodestyle, F: pyflakes (imports y variables sin usar), I: orden de imports.
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["estimator_chat", "tests"]

[tool.ruff.lint.per-file-ignores]
# Los datos de las pruebas (textos de ejemplo) pueden superar la longitud de línea.
"tests/**" = ["E501"]
