[project]
name = "estimador-cag"
version = "0.1.0"
description = "CAG-based software project estimation API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "streamlit>=1.64.0",
    "httpx>=0.27",
    "redis>=5.0,<7",
    "structlog>=25.1,<27",
    "jinja2>=3.1,<4",
    "redisvl>=0.8",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "fakeredis>=2.26",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W: estilo pycodestyle, F: pyflakes (imports y variables sin usar), I: orden de imports.
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals", "tests"]

[tool.ruff.lint.per-file-ignores]
# Los datos de las pruebas (parámetros, textos de ejemplo) pueden superar la longitud de línea.
"tests/**" = ["E501"]
