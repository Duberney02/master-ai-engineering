# Verificación del Bloque 3. Cargar después del Compose de verificación y del complemento del Bloque 1:
#   -f docker-compose.verify.yml -f <cambio>/compose.caracterizacion.yml -f <cambio>/compose.bloque3.yml
# Reutiliza las imágenes del Bloque 1 y monta las fuentes vigentes en solo lectura. Los servicios de lint y React
# no tienen red. Las bases viven en tmpfs dentro de redes internas del proyecto de pruebas.
services:
  web-test:
    build: !reset null
    volumes: !override
      - type: bind
        source: ./estimator-web-go
        target: /src
        read_only: true
        bind:
          create_host_path: false
  web-lint:
    build: !reset null
    volumes: !override
      - type: bind
        source: ./estimator-web-go
        target: /src
        read_only: true
        bind:
          create_host_path: false
  api-test:
    build: !reset null
    volumes: !override
      - type: bind
        source: ./estimador-cag
        target: /app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.block1-evidencias/parte-c/cl100k_base.tiktoken
        target: /opt/tiktoken-cache/9b5ad71b2ce5302211f9c61530b329a4922fc6a4
        read_only: true
        bind:
          create_host_path: false
  api-lint:
    build: !reset null
    volumes: !override
      - type: bind
        source: ./estimador-cag
        target: /app
        read_only: true
        bind:
          create_host_path: false
  react-test:
    build: !reset null
    volumes: !override &bloque3-react
      - type: bind
        source: ./estimator-web-react/src
        target: /app/src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./estimator-web-react/index.html
        target: /app/index.html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./estimator-web-react/vite.config.ts
        target: /app/vite.config.ts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./estimator-web-react/tsconfig.json
        target: /app/tsconfig.json
        read_only: true
        bind:
          create_host_path: false
  react-build:
    image: homelab-block1-307a8b9-react:test
    pull_policy: never
    working_dir: /app
    volumes: *bloque3-react
    command: ["npm", "run", "build"]
    network_mode: none

  # --- Integración Go → FastAPI real del Bloque 2, repetida con las fuentes vigentes (regresión) ---
  api-sse-fixture:
    image: homelab-block1-307a8b9-api:test
    pull_policy: never
    working_dir: /app
    volumes:
      - type: bind
        source: ./estimador-cag
        target: /app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.block1-evidencias/parte-c/cl100k_base.tiktoken
        target: /opt/tiktoken-cache/9b5ad71b2ce5302211f9c61530b329a4922fc6a4
        read_only: true
        bind:
          create_host_path: false
    environment:
      LLM_PROVIDER: openai
      OPENAI_API_KEY: sk-test-dummy
      TIKTOKEN_CACHE_DIR: /opt/tiktoken-cache
      TEST_DATABASE_URL: postgresql+asyncpg://estimator:estimator-dev@block1-api-db:5432/estimator_test
    entrypoint: ["python", "-m", "uvicorn", "tests.block2_sse_fixture:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [block1-api]
  web-sse-test:
    image: homelab-block1-307a8b9-go:test
    pull_policy: never
    working_dir: /src
    volumes:
      - type: bind
        source: ./estimator-web-go
        target: /src
        read_only: true
        bind:
          create_host_path: false
    environment:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
      BLOCK2_SSE_FIXTURE_URL: http://api-sse-fixture:8000
    entrypoint: ["go", "test", "-p", "1", "-count=1", "-v"]
    command: ["./internal/web", "-run", "^Test(SSE|REST)CancellationThroughPython$"]
    networks: [block1-api]

  # --- Matriz de paridad: comprueba que cada prueba nombrada existe y pasó en los resultados reales ---
  parity-check:
    image: homelab-block1-307a8b9-react:test
    pull_policy: never
    working_dir: /fixtures
    volumes:
      - type: bind
        source: ./openspec/changes/archive/2026-11-26-homelab-route-clients-through-go
        target: /fixtures
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.block3/evidencias
        target: /evidencias
        read_only: true
        bind:
          create_host_path: false
    command: ["node", "/fixtures/verificar-paridad.mjs"]
    network_mode: none

  # --- nginx delante de un upstream simulado de Go (tarea 6.1): SSE sin buffering, cancelación, plazos y límites ---
  block3-upstream:
    image: homelab-block1-307a8b9-react:test
    pull_policy: never
    working_dir: /fixtures
    volumes:
      - type: bind
        source: ./openspec/changes/archive/2026-11-26-homelab-route-clients-through-go/nginx-fixture.mjs
        target: /fixtures/nginx-fixture.mjs
        read_only: true
        bind:
          create_host_path: false
    command: ["node", "/fixtures/nginx-fixture.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [block3-edge]

  block3-nginx: &block3-nginx
    image: nginxinc/nginx-unprivileged:stable-alpine
    pull_policy: never
    environment: &block3-timeouts
      API_UPSTREAM: http://block3-upstream:9000
      NGINX_CONNECT_TIMEOUT: 1s
      NGINX_REGULAR_TIMEOUT: 2s
      NGINX_LONG_TIMEOUT: 6s
    volumes:
      - type: bind
        source: ./estimator-web-react/nginx.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./estimator-web-react/validar-plazos.sh
        target: /docker-entrypoint.d/15-validar-plazos.sh
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      block3-upstream:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--timeout=3", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [block3-edge]

  # Plazos incoherentes (habitual > largo): el contenedor debe negarse a arrancar.
  block3-nginx-bad:
    <<: *block3-nginx
    environment:
      <<: *block3-timeouts
      NGINX_REGULAR_TIMEOUT: 5s
      NGINX_LONG_TIMEOUT: 3s
    depends_on: !reset {}
    healthcheck:
      disable: true

  block3-nginx-check:
    image: homelab-block1-307a8b9-react:test
    pull_policy: never
    working_dir: /fixtures
    environment:
      NGINX_URL: http://block3-nginx:8080
      UPSTREAM_URL: http://block3-upstream:9000
      NGINX_REGULAR_TIMEOUT: 2s
      NGINX_LONG_TIMEOUT: 6s
    volumes:
      - type: bind
        source: ./openspec/changes/archive/2026-11-26-homelab-route-clients-through-go/nginx-check.mjs
        target: /fixtures/nginx-check.mjs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./estimator-web-react/Dockerfile
        target: /fixtures/Dockerfile
        read_only: true
        bind:
          create_host_path: false
    command: ["node", "/fixtures/nginx-check.mjs"]
    depends_on:
      block3-nginx:
        condition: service_healthy
    networks: [block3-edge]

networks:
  block3-edge:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
